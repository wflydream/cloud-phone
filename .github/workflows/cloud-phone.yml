name: cloud-phone
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep the phone alive for N minutes (max 55)"
        default: "45"
jobs:
  phone:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify scrcpy >/dev/null
      - name: Env
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: AVD
        run: |
          echo "$ANDROID_HOME" ; ls "$ANDROID_HOME"
          sdkmanager --licenses <<< "y" >/dev/null 2>&1 || true
          sdkmanager "system-images;android-34;google_apis;x86_64" 2>&1 | tail -3
          avdmanager list device -c | tr '\n' ' ' | head -c 600; echo
          DEV=$(avdmanager list device -c | grep -qx pixel_6 && echo pixel_6 || echo pixel)
          echo no | avdmanager create avd -n phone -k "system-images;android-34;google_apis;x86_64" -d "$DEV" || true
          avdmanager list avd
          AVD_DIR=$(avdmanager list avd | sed -n 's/.*Path: \(.*\)\/[^/]*$/\1/p' | head -1)
          echo "avd dir: $AVD_DIR"
          echo "ANDROID_AVD_HOME=$AVD_DIR" >> "$GITHUB_ENV"
          ANDROID_AVD_HOME="$AVD_DIR" emulator -list-avds | tee /tmp/avds.txt
          grep -qx phone /tmp/avds.txt
      - name: Phone on :99 + browser VNC
        env: { MINUTES: "${{ inputs.minutes }}" }
        run: |
          Xvfb :99 -screen 0 1400x1000x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          emulator -avd phone -no-window -no-audio -no-boot-anim -no-snapshot -memory 3072 -gpu swiftshader_indirect > /tmp/emu.log 2>&1 &
          if ! timeout 420 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 5; done'; then
            echo "BOOT FAILED"; tail -40 /tmp/emu.log; exit 1
          fi
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true
          curl -sL -o /tmp/fdroid.apk https://f-droid.org/F-Droid.apk && adb install -r /tmp/fdroid.apk >/dev/null 2>&1 || true
          LIBGL_ALWAYS_SOFTWARE=1 SDL_RENDER_DRIVER=software scrcpy --max-size 1024 --no-audio --window-title phone > /tmp/scrcpy.log 2>&1 &
          sleep 10
          pgrep -a scrcpy || { echo "SCRCPY PROBLEM"; tail -20 /tmp/scrcpy.log; }
          x11vnc -display :99 -forever -shared -nopw -noxdamage -rfbport 5900 -quiet > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          curl -sL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:6080 --no-autoupdate --protocol http2 > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 90); do grep -qE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log && break; sleep 2; done
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          [ -n "$URL" ] || { tail -30 /tmp/tunnel.log; exit 1; }
          echo "OPEN: $URL/vnc.html?autoconnect=true&resize=scale&reconnect=true" | tee -a "$GITHUB_STEP_SUMMARY"
          sleep "${MINUTES}m"

name: cloud-phone
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Keep the phone alive for N minutes"
        default: "50"
jobs:
  phone:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb x11vnc novnc websockify scrcpy nginx >/dev/null
      - name: Restore app login (TikTok data)
        uses: actions/cache/restore@v4
        with:
          path: /tmp/tt-data.tgz
          key: tiktok-data-${{ github.run_id }}
          restore-keys: |
            tiktok-data-
      - name: Env
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: AVD
        run: |
          sdkmanager --licenses <<< "y" >/dev/null 2>&1 || true
          sdkmanager "system-images;android-34;google_apis;x86_64" 2>&1 | tail -3
          DEV=$(avdmanager list device -c | grep -qx pixel_6 && echo pixel_6 || echo pixel)
          echo no | avdmanager create avd -n phone -k "system-images;android-34;google_apis;x86_64" -d "$DEV" || true
          AVD_DIR=$(avdmanager list avd | sed -n 's/.*Path: \(.*\)\/[^/]*$/\1/p' | head -1)
          echo "ANDROID_AVD_HOME=$AVD_DIR" >> "$GITHUB_ENV"
          ANDROID_AVD_HOME="$AVD_DIR" emulator -list-avds | tee /tmp/avds.txt
          grep -qx phone /tmp/avds.txt
      - name: Phone + panel
        env:
          MINUTES: "${{ inputs.minutes }}"
          BASIC_USER: "${{ secrets.BASIC_USER }}"
          BASIC_PASS: "${{ secrets.BASIC_PASS }}"
          STATE_PAT: "${{ secrets.STATE_PAT }}"
        run: |
          ts() { date +%T; }
          Xvfb :99 -screen 0 1000x900x24 >/dev/null 2>&1 &
          export DISPLAY=:99
          emulator -avd phone -no-window -no-audio -no-boot-anim -no-snapshot -memory 3072 -cores 4 \
            -gpu swiftshader_indirect -netdelay none -netspeed full \
            > /tmp/emu.log 2>&1 &
          wait_boot() { timeout 480 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | grep -q 1; do sleep 5; done'; }
          if ! wait_boot; then echo "BOOT FAILED $(ts)"; tail -40 /tmp/emu.log; exit 1; fi
          echo "boot $(ts)"

          # adb root 会重启 adbd，把已连上的 scrcpy 踢掉（画面冻在最后一帧），所以必须放在 scrcpy 之前
          adb root >/dev/null 2>&1 || true; sleep 3
          # 分辨率也必须在 scrcpy 之前定好：启动后再改 wm size 会让 scrcpy 直接退出（黑屏）
          adb shell wm size 540x960; adb shell wm density 240
          for s in window_animation_scale transition_animation_scale animator_duration_scale; do adb shell settings put global $s 0; done
          adb shell input keyevent KEYCODE_WAKEUP; adb shell wm dismiss-keyguard || true

          # scrcpy 守护：挂了自动重启
          ( while true; do
              DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 SDL_RENDER_DRIVER=software \
                scrcpy --max-size 540 --max-fps 30 --video-bit-rate 1M --no-audio --window-title phone >> /tmp/scrcpy.log 2>&1 || true
              sleep 3
            done ) &

          LIBGL_ALWAYS_SOFTWARE=1 SDL_RENDER_DRIVER=software scrcpy --max-size 540 --max-fps 30 --video-bit-rate 1M --no-audio --window-title phone > /tmp/scrcpy.log 2>&1 &
          sleep 8
          pgrep -a scrcpy || { echo "SCRCPY PROBLEM"; tail -20 /tmp/scrcpy.log; }

          x11vnc -display :99 -forever -shared -nopw -rfbport 5900 -quiet -wait 2 -defer 0 -threads 2 > /tmp/x11vnc.log 2>&1 &
          websockify --web=/usr/share/novnc 6080 localhost:5900 > /tmp/websockify.log 2>&1 &
          sudo cp panel.html /usr/share/novnc/panel.html
          python3 control.py > /tmp/control.log 2>&1 &
          printf '%s:%s\n' "$BASIC_USER" "$(openssl passwd -apr1 "$BASIC_PASS")" > /tmp/.htpasswd
          chmod 644 /tmp/.htpasswd
          sudo nginx -c "$PWD/nginx.conf" -g 'daemon off;' > /tmp/nginx.log 2>&1 &
          sleep 3
          curl -s -o /dev/null -w 'panel http=%{http_code}\n' http://127.0.0.1:8080/panel.html
          echo "panel $(ts)"

          curl -sL -o /tmp/cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://localhost:8080 --no-autoupdate --protocol http2 > /tmp/tunnel.log 2>&1 &
          for i in $(seq 1 90); do grep -qE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log && break; sleep 2; done
          URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
          [ -n "$URL" ] || { tail -30 /tmp/tunnel.log; exit 1; }
          # 链接只写进私有仓库 cloud-phone-state（公开仓库日志里不出现 URL）
          printf '%s' "$URL/panel.html" > /tmp/url.txt
          B64=$(base64 -w0 /tmp/url.txt)
          OLD=$(curl -s -H "Authorization: token $STATE_PAT" \
                 "https://api.github.com/repos/wflydream/cloud-phone-state/contents/url.txt" | python3 -c 'import sys,json;print(json.load(sys.stdin).get("sha",""))' 2>/dev/null)
          for i in 1 2 3; do
            BODY=$(python3 -c 'import json,sys;print(json.dumps({"message":"url","content":sys.argv[1],**({"sha":sys.argv[2]} if sys.argv[2] else {})}))' "$B64" "$OLD")
            if curl -s -X PUT -H "Authorization: token $STATE_PAT" \
                 -H 'Accept: application/vnd.github+json' \
                 -d "$BODY" \
                 "https://api.github.com/repos/wflydream/cloud-phone-state/contents/url.txt" | grep -q '"content"'; then
              echo "url published to private state repo $(ts)"; break
            fi
            sleep 3
          done

          # 语言/时区（不要再 adb root，会踢掉 scrcpy）
          adb shell settings put system system_locales zh-CN || true
          adb shell setprop persist.sys.timezone Asia/Shanghai || true
          adb shell settings put global auto_time 1
          # 关掉 ANR/崩溃对话框：swiftshader 下 SystemUI 偶尔 ANR，弹窗会把点击吃掉
          adb shell settings put global hide_error_dialogs 1
          echo "guest tuned $(ts)"

          # 网络判据：VALIDATED（Android shell 的 ping 没有 raw socket 权限，必失败）
          netok=0
          for i in $(seq 1 30); do
            if adb shell dumpsys connectivity 2>/dev/null | grep -q 'VALIDATED'; then netok=1; break; fi
            sleep 3
          done
          echo "net_validated=$netok $(ts)"
          adb shell dumpsys connectivity 2>/dev/null | grep -oE 'InterfaceName: [a-z0-9]+|DnsAddresses: \[[^]]*\]|VALIDATED' | head -6

          # TikTok：APKPure 直链，APK 或 XAPK 都处理；时间都封顶，装不上不算 job 失败
          curl -sL --max-time 240 -A 'Mozilla/5.0 (Linux; Android 14)' -o /tmp/tiktok.apk \
            'https://d.apkpure.com/b/APK/com.zhiliaoapp.musically?version=latest' || true
          echo "tiktok dl bytes: $(stat -c%s /tmp/tiktok.apk 2>/dev/null || echo 0) $(ts)"
          if [ "$(head -c 2 /tmp/tiktok.apk)" = "PK" ]; then
            rm -rf /tmp/tkx && mkdir /tmp/tkx && unzip -oq /tmp/tiktok.apk -d /tmp/tkx
            APKS=$(find /tmp/tkx -name '*.apk' | tr '\n' ' ')
            if [ -n "$APKS" ]; then timeout 300 adb install-multiple -r $APKS 2>&1 | tail -4; else timeout 300 adb install -r /tmp/tiktok.apk 2>&1 | tail -4; fi
          else
            timeout 300 adb install -r /tmp/tiktok.apk 2>&1 | tail -4
          fi
          adb shell pm list packages | grep musically || echo "tiktok not installed"
          adb shell monkey -p com.zhiliaoapp.musically -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1 || true
          echo "tiktok step done $(ts)"

          # 恢复上次缓存里的 TikTok 登录态（若存在）
          if [ -s /tmp/tt-data.tgz ]; then
            adb shell id | grep -q 'uid=0' || adb root >/dev/null 2>&1 || true
            adb shell "tar xzf - -C /data/data" < /tmp/tt-data.tgz && adb shell restorecon -R /data/data/com.zhiliaoapp.musically 2>/dev/null && echo "login restored $(ts)" || echo "login restore failed"
            adb shell am force-stop com.zhiliaoapp.musically || true
          fi

          sleep "${MINUTES}m"

          # 机器销毁前把登录态打包缓存，下次同样 key 前缀能取回
          adb shell id | grep -q 'uid=0' || adb root >/dev/null 2>&1 || true
          if adb shell pm list packages | grep -q com.zhiliaoapp.musically; then
            adb exec-out "tar czf - -C /data/data com.zhiliaoapp.musically" > /tmp/tt-data.tgz 2>/dev/null || true
            ls -l /tmp/tt-data.tgz || true
          fi

      - name: Save app login (TikTok data)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/tt-data.tgz
          key: tiktok-data-${{ github.run_id }}

worker_processes 1;
error_log /tmp/nginx-error.log warn;
pid /tmp/nginx.pid;
events { worker_connections 256; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format cp '$time_iso8601 $remote_addr user=$remote_user status=$status $request';
  access_log /tmp/nginx-access.log cp;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 8080;
    auth_basic "cloud phone";
    auth_basic_user_file /tmp/.htpasswd;
    location /api/ { proxy_pass http://127.0.0.1:8090; }
    location /shots/ { proxy_pass http://127.0.0.1:8090; }
    location / {
      proxy_pass http://127.0.0.1:6080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }
}
